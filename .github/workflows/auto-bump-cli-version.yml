name: Changeset Required

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - ".dockerignore"
      - ".npmignore"
      - ".github/scripts/smoke-selfhost-image.sh"
      - ".github/workflows/auto-bump-cli-version.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/desktop.yml"
      - ".github/workflows/publish.yml"
      - ".github/workflows/selfhost-image.yml"
      - "CHANGELOG.md"
      - "README.md"
      - "apps/desktop/**"
      - "apps/cli/**"
      - "apps/local/**"
      - "apps/local-dashboard/**"
      - "apps/selfhost/**"
      - "assets/**"
      - "bin/**"
      - "bun.lock"
      - "cli/selftune/**"
      - "package.json"
      - "packages/control-plane/**"
      - "packages/dashboard-core/**"
      - "packages/harnesses/**"
      - "packages/orchestration/**"
      - "packages/runtime/**"
      - "packages/telemetry-contract/**"
      - "packages/ui/**"
      - "scripts/pack-package.ts"
      - "scripts/publish-package-json.cjs"
      - "scripts/smoke-packed-package.ts"
      - "scripts/release-version.ts"
      - "scripts/render-release-notes.ts"
      - "scripts/sync-skill-version.ts"
      - "scripts/validate-release-ref.ts"
      - "skill/**"
      - "templates/**"
      - "lint-architecture.ts"
      - "turbo.json"

permissions:
  contents: read

concurrency:
  group: changeset-required-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changeset-required:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Accept the generated Version Packages pull request
        if: github.head_ref == 'changeset-release/main'
        run: echo "The Changesets release pull request consumes changesets instead of adding one."

      - name: Checkout
        if: github.head_ref != 'changeset-release/main'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        if: github.head_ref != 'changeset-release/main'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        if: github.head_ref != 'changeset-release/main'
        run: bun install --frozen-lockfile

      - name: Require a release changeset
        if: github.head_ref != 'changeset-release/main'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          bunx changeset status \
            --since="origin/${BASE_REF}" \
            --output=/tmp/changeset-status.json
          jq --exit-status '.releases | length > 0' /tmp/changeset-status.json >/dev/null || {
            echo "This pull request changes a shipped surface but has no changeset." >&2
            echo "Add a .changeset/*.md entry for '@selftune/desktop', the coupled release-train package." >&2
            exit 1
          }
