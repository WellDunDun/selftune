name: Desktop

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to build and attach signed desktop artifacts to
        required: false
        type: string
  pull_request:
    paths:
      - apps/desktop/**
      - apps/local-dashboard/**
      - cli/selftune/dashboard-server.ts
      - cli/selftune/skill-portfolio.ts
      - package.json
      - bun.lock
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            target: bun-darwin-arm64
            package_script: package:mac
            arch_flag: --arm64
            artifact: selftune-desktop-macos-arm64
          - os: macos-15-intel
            platform: mac
            target: bun-darwin-x64
            package_script: package:mac
            arch_flag: --x64
            artifact: selftune-desktop-macos-x64
          - os: ubuntu-latest
            platform: linux
            target: bun-linux-x64
            package_script: package:linux
            arch_flag: --x64
            artifact: selftune-desktop-linux-x64
          - os: windows-latest
            platform: win
            target: bun-windows-x64
            package_script: package:win
            arch_flag: --x64
            artifact: selftune-desktop-windows-x64
    runs-on: ${{ matrix.os }}
    env:
      BUN_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/desktop typecheck
      - run: bun test apps/desktop/src/main/sidecar-protocol.test.ts
      - run: bun run --cwd apps/desktop build
      - run: bun run --cwd apps/desktop smoke:sidecar

      - name: Require macOS release signing credentials
        if: (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')) && matrix.platform == 'mac'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.DESKTOP_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.DESKTOP_APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.DESKTOP_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.DESKTOP_APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required macOS release secret(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Stage Apple API key
        if: (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')) && matrix.platform == 'mac'
        shell: bash
        env:
          DESKTOP_APPLE_API_KEY: ${{ secrets.DESKTOP_APPLE_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/private_keys"
          printf '%s' "$DESKTOP_APPLE_API_KEY" > "${RUNNER_TEMP}/private_keys/AuthKey.p8"
          chmod 600 "${RUNNER_TEMP}/private_keys/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=${RUNNER_TEMP}/private_keys/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build unsigned desktop distributable
        if: github.event_name != 'release' && (github.event_name != 'workflow_dispatch' || inputs.release_tag == '')
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: bun run --cwd apps/desktop ${{ matrix.package_script }} -- ${{ matrix.arch_flag }}

      - name: Build signed macOS release distributable
        if: (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')) && matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.DESKTOP_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ env.APPLE_API_KEY_PATH }}
          APPLE_API_KEY_ID: ${{ secrets.DESKTOP_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.DESKTOP_APPLE_API_ISSUER }}
          DESKTOP_REQUIRE_CODE_SIGNING: "true"
        run: bun run --cwd apps/desktop ${{ matrix.package_script }} -- ${{ matrix.arch_flag }}

      - name: Build non-macOS release distributable
        if: (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')) && matrix.platform != 'mac'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: bun run --cwd apps/desktop ${{ matrix.package_script }} -- ${{ matrix.arch_flag }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
          if-no-files-found: error

  attach-release:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: desktop-artifacts
          merge-multiple: true
      - name: Attach desktop installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" desktop-artifacts/* --clobber --repo "${{ github.repository }}"
